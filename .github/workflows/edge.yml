name: Edge Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-edge:
    name: Build edge artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Package runtime artifact
        run: |
          mkdir -p staging
          cp target/x86_64-unknown-linux-musl/release/api staging/api
          cp start.sh staging/start.sh
          cp -r public/ staging/
          chmod +x staging/api staging/start.sh
          cd staging
          zip -r ../release.zip api start.sh public/

      - name: Package Discloud edge bundle
        run: |
          mkdir -p deploy-edge
          cp Dockerfile deploy-edge/Dockerfile
          cp discloud.config deploy-edge/discloud.config
          cd deploy-edge
          zip -r ../deploy-edge.zip Dockerfile discloud.config

      - name: Move edge tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f edge "$GITHUB_SHA"
          git push origin refs/tags/edge --force

      - name: Publish edge release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: Edge
          prerelease: true
          make_latest: false
          files: |
            release.zip
            deploy-edge.zip
